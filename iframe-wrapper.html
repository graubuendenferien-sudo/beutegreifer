<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beutegreifer Tool</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    iframe {
      display: block;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="grf-frame"
          src="https://graubuendenferien-sudo.github.io/beutegreifer/"
          scrolling="no"></iframe>

  <script>
    var frame = document.getElementById('grf-frame');
    var lastHeight = 0;
    frame.style.height = '400px'; // moderater Startwert, bis die echte Höhe kommt

    window.addEventListener('message', function (event) {
      if (event.origin.indexOf('graubuendenferien-sudo.github.io') === -1) return;
      var h = (event.data || {}).height;
      if (!h) return;
      if (Math.abs(h - lastHeight) > 2) {
        lastHeight = h;
        frame.style.height = h + 'px';
      }
    });
  </script>
</body>
</html>
