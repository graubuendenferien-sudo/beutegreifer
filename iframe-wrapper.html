<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beutegreifer Tool</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    iframe {
      display: block;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="grf-frame"
          src="https://graubuendenferien-sudo.github.io/beutegreifer/"
          scrolling="no"></iframe>

  <script>
    // Empfängt die vom Tool gesendete Höhe und passt das iframe dynamisch an
    window.addEventListener('message', function (event) {
      if (event.origin !== 'https://graubuendenferien-sudo.github.io') return;
      var h = event.data && event.data.grfBeutegreiferHeight;
      if (h) {
        document.getElementById('grf-frame').style.height = h + 'px';
      }
    });
  </script>
</body>
</html>
